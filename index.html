<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f6efe5"><title>Basketball Team Stats</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="favicon.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Team Stats"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style id="css">
:root{--p:#e8661c;--accent2:#1f1a17;--opp:#1f1a17;--oppTx:#fff;--bg:#f6efe5;--surface:#ffffff;--surface2:#faf5ee;--line:rgba(74,44,20,.11);--line2:rgba(74,44,20,.2);--text:#1f1a17;--muted:#7d6f63;--accent:#e8661c;--ball:#e8661c;--ball-d:#c9510f;--miss:#c4372c;--foul:#c27a00;--ink:#1f1a17;--cond:'Barlow Condensed',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
body{background:repeating-linear-gradient(90deg,rgba(150,95,45,.035) 0 46px,transparent 46px 92px),linear-gradient(180deg,#fbf7f1 0%,#f3e9dc 100%);background-attachment:fixed}
button{font:inherit;border:0;cursor:pointer;touch-action:manipulation;color:inherit;background:none;padding:0}
input,select{font:inherit;font-size:16px}
#root{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
/* scoreboard */
.sb{margin:8px 12px 0;border-radius:24px;background:var(--surface);border:1px solid var(--line);padding:12px 10px 12px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;box-shadow:0 10px 28px rgba(90,50,20,.10),0 1px 0 rgba(255,255,255,.8) inset;position:relative;overflow:hidden}
.sb::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,var(--p) 0 40%,var(--accent2) 40% 49.5%,transparent 49.5% 50.5%,var(--opp) 50.5%)}
.tm{display:flex;flex-direction:column;align-items:center;min-width:0}
.ab{font:700 17px var(--cond);letter-spacing:1.2px;color:var(--text);display:flex;align-items:center;gap:6px;padding:4px 9px 4px 8px;border-radius:9px;background:var(--surface2);border:1px solid var(--line);max-width:100%}
.ab:active{background:#f1e6d8}
.ab::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--opp);box-shadow:0 0 0 1px rgba(0,0,0,.15);flex:none}
.ab.us::before{background:var(--p);box-shadow:0 0 0 2px var(--accent2),0 0 0 3px rgba(0,0,0,.12)}
.ab svg{width:11px;height:11px;color:var(--muted);flex:none}
.ab .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc{font:800 clamp(48px,14vw,62px)/1 var(--cond);font-variant-numeric:tabular-nums;letter-spacing:-.5px;margin:4px 0 4px}
.meta{font-size:11px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;height:30px;display:flex;align-items:center;gap:4px;font-weight:600}
.meta b{color:var(--text);font-weight:700}
.oppb{background:var(--surface2);border:1px solid var(--line2);color:var(--text);border-radius:8px;height:30px;padding:0 8px;font:700 16px var(--cond);letter-spacing:.5px}
.oppb:active{background:#f1e6d8}
.mid{display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 4px}
.ck{background:#1f1a17;border-radius:14px;padding:7px 10px 6px;min-width:100px;display:flex;flex-direction:column;align-items:center;box-shadow:inset 0 2px 8px rgba(0,0,0,.6),0 4px 12px rgba(31,26,23,.2)}
.ck .t{font:700 34px/1 var(--cond);font-variant-numeric:tabular-nums;color:#ffb04a;letter-spacing:1px}
.ck.run .t{color:#fff}
.ck .pr{font-size:10px;font-weight:700;letter-spacing:1.2px;color:#a89a8d;margin-top:3px;display:flex;align-items:center;gap:5px;text-transform:uppercase}
.ck.run .pr::before{content:"";width:6px;height:6px;border-radius:50%;background:#ff4d3d;box-shadow:0 0 8px #ff4d3d;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.3}}
.ckedit{font-size:11.5px;color:var(--muted);font-weight:600;padding:4px 9px;border-radius:7px;display:flex;align-items:center;gap:4px}
.ckedit svg{width:12px;height:12px}
/* team switcher */
.topbar{margin:10px 12px 0;display:flex;align-items:center;justify-content:space-between;gap:8px}
.teamsw{display:flex;align-items:center;gap:8px;font:700 19px var(--cond);letter-spacing:.4px;padding:6px 12px 6px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line2);box-shadow:0 2px 8px rgba(90,50,20,.06);min-width:0;max-width:75%}
.teamsw i{width:13px;height:13px;border-radius:50%;background:linear-gradient(135deg,var(--p) 58%,var(--accent2) 58%);box-shadow:0 0 0 1px rgba(0,0,0,.15);flex:none}
.teamsw .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.teamsw svg{width:16px;height:16px;color:var(--muted);flex:none}
.teamsw:active{background:#f1e6d8}
.tcount{font-size:11.5px;font-weight:600;color:var(--muted)}
/* status row */
.status{margin:10px 12px 0;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px}
.chip{font-size:12.5px;font-weight:600;color:var(--muted);padding:6px 8px;border-radius:999px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;min-width:0}
.chip.act{background:color-mix(in srgb,var(--accent) 13%,#fff);color:var(--text);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent)}
.chip.subm{background:#efe3d4;color:#6b3d17;border:1px solid #d9bf9f}
.tb{display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line2);font-size:13px;font-weight:700;box-shadow:0 2px 6px rgba(90,50,20,.06)}
.tb svg{width:17px;height:17px}
.tb:active{background:#f1e6d8}
.tb.on{background:var(--ink);color:#fff;border-color:var(--ink)}
/* players */
.court{margin:8px 12px 0;display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.pc{background:none;border:2px solid transparent;border-radius:14px;padding:3px 1px 4px;display:flex;flex-direction:column;align-items:center;position:relative;transition:transform .12s;min-width:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.pc:active{transform:scale(.95)}
.pc .n{font:700 32px/1 var(--cond);font-variant-numeric:tabular-nums}
.pc .nm{font-size:11.5px;font-weight:500;color:var(--muted);max-width:100%;padding:0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.pips{display:flex;gap:2px;margin-top:7px}
.pips i{width:7px;height:3px;border-radius:2px;background:rgba(74,44,20,.13)}
.pips i.on{background:var(--foul)}
.pips.hot i.on{background:var(--miss)}
.pt{position:absolute;top:0;right:2px;z-index:2;font:700 12px/1.35 var(--cond);color:#fff;background:var(--ink);border-radius:999px;padding:0 6px;box-shadow:0 2px 5px rgba(0,0,0,.2)}
.jz{display:block;width:100%;max-width:66px;filter:drop-shadow(0 3px 4px rgba(60,30,10,.2));transition:transform .15s ease,filter .15s ease}
.jz svg{display:block;width:100%;height:auto}
.pc.sel .jz{transform:translateY(-4px) scale(1.07);filter:drop-shadow(0 8px 10px color-mix(in srgb,var(--accent) 60%,transparent))}
.pc.sel .nm{background:var(--ink);color:#fff;border-radius:999px;padding:1px 8px}
.pc.sel .pips i.on{background:var(--miss)}
.pc.out .jz{filter:grayscale(1)}
.pc.out{opacity:.45}
.bp.subm-on{border-style:dashed;border-color:#b98a5e;background:#fffaf3}
.pc.subm-on{border:2px dashed #b98a5e;background:#fffaf3}
.benchrow{margin:8px 12px 0;display:flex;align-items:center;gap:8px}
.blbl{font:700 11px var(--cond);letter-spacing:1.5px;color:var(--muted);flex:none}
.bench{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none;padding:2px}
.bench::-webkit-scrollbar{display:none}
.bp{flex:none;background:var(--surface);border:1px solid var(--line2);border-radius:999px;padding:3px 11px 3px 6px;font-size:12.5px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:5px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.bp b{color:var(--text);font:700 16px var(--cond)}
.bp .mj{width:24px;display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.15))}
.bp .mj svg{display:block;width:100%;height:auto}
.bp em{font-style:normal;color:var(--ball-d);font:700 13px var(--cond)}
.bp.sel{background:var(--ink);border-color:var(--ink);color:#e9ded3;box-shadow:0 0 0 2px var(--accent)}
.bp.sel b{color:#fff}
/* pad */
.pad{margin:12px 12px 0;display:flex;flex-direction:column;gap:8px}
.shots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.shot{display:flex;flex-direction:column;gap:6px}
.mk{height:clamp(58px,9.4vh,100px);border-radius:18px;background:radial-gradient(120% 90% at 30% 10%,#ff9a4d 0%,#ec6a1e 45%,#cf520f 100%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 8px 18px rgba(232,102,28,.28),inset 0 1px 0 rgba(255,255,255,.35),inset 0 -2px 0 rgba(0,0,0,.12);transition:transform .06s,filter .06s;position:relative;overflow:hidden}
.mk::after{content:"";position:absolute;inset:-40% -10%;border-left:1.5px solid rgba(60,25,5,.16);border-right:1.5px solid rgba(60,25,5,.16);border-radius:50%;pointer-events:none}
.mk span{font:800 clamp(30px,9vw,40px)/1 var(--cond);text-shadow:0 1px 0 rgba(0,0,0,.15);position:relative}
.mk small{font-size:10.5px;font-weight:700;letter-spacing:.6px;opacity:.9;text-transform:uppercase;margin-top:3px;position:relative}
.ms{height:clamp(40px,5.1vh,52px);border-radius:13px;background:var(--surface);border:1.5px solid #ead7c6;color:var(--miss);font:700 17px var(--cond);letter-spacing:1.5px;transition:transform .06s,background .06s}
.ms:active{background:#fbeee6}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ac{height:clamp(52px,8vh,86px);border-radius:15px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(90,50,20,.06);transition:transform .06s,background .06s}
.ac:active{background:var(--surface2)}
.ac span{font:700 21px/1 var(--cond);letter-spacing:1px}
.ac small{font-size:10.5px;font-weight:600;color:var(--muted);margin-top:4px;letter-spacing:.2px}
.ac.cnt small{color:var(--text);font:700 14px var(--cond);letter-spacing:.5px}
.ac.bad span{color:var(--miss)}.ac.warn span{color:var(--foul)}
.ac.ghost{background:transparent;border:1.5px dashed var(--line2);box-shadow:none}
.mk:active,.ac:active,.ms:active{transform:scale(.95)}
.mk:active{filter:brightness(.92)}
.pending{outline:3px solid var(--ink);outline-offset:2px}
.targets{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tg{height:clamp(50px,6.4vh,62px);border-radius:15px;background:var(--surface);border:1px solid var(--line2);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:0 14px;text-align:left;box-shadow:0 3px 10px rgba(90,50,20,.06);transition:transform .1s,box-shadow .1s}
.tg .k{font-size:10px;font-weight:700;letter-spacing:1.2px;color:var(--muted);text-transform:uppercase}
.tg b{font:700 20px/1.1 var(--cond);letter-spacing:1px}
.tg small{font-size:11px;color:var(--muted);font-weight:600}
.tg .row{display:flex;align-items:baseline;gap:8px;width:100%}
.tg.opp{background:var(--opp);color:var(--oppTx);border-color:rgba(0,0,0,.14)}
.tg.opp .k,.tg.opp small{color:inherit;opacity:.72}
.tg.sel{box-shadow:0 0 0 2.5px var(--accent),0 10px 22px color-mix(in srgb,var(--accent) 30%,transparent);transform:translateY(-2px)}
.tg:active{transform:scale(.97)}
.numdisp{display:flex;align-items:center;justify-content:center;gap:6px;background:#1f1a17;color:#ffb04a;border-radius:18px;padding:14px 0;font:700 66px/1 var(--cond);box-shadow:inset 0 3px 12px rgba(0,0,0,.6)}
.numdisp i{opacity:.35;font-style:normal}
.numdisp .hash{opacity:.55;font-size:46px}
.np{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.np button{height:58px;border-radius:14px;background:var(--surface);border:1px solid var(--line2);font:700 28px var(--cond)}
.np button:active{background:var(--surface2)}
.np .ok{background:var(--accent);color:#fff;border-color:transparent}
.qn{display:flex;flex-wrap:wrap;gap:6px}
.qn button,.qn span.c{padding:7px 12px;border-radius:999px;background:var(--surface2);border:1px solid var(--line2);font:700 16px var(--cond)}
.qn em{font-style:normal;color:var(--miss);margin-left:4px}
.menu button.tpick{padding:12px 14px}
.tl{display:flex;align-items:center;gap:11px;min-width:0}
.tl i{width:16px;height:16px;border-radius:50%;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.tl b{display:block;font-size:15px}
.tl small{display:block;color:var(--muted);font-weight:500;font-size:12px;margin-top:1px}
.menu button.tpick.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.ostat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;margin-top:8px}
.ostat .qn{margin-top:8px}
@keyframes flash{0%{background:var(--accent);border-color:var(--accent);color:#fff;transform:scale(1.1)}60%{transform:scale(1)}100%{}}
.flash{animation:flash .7s ease-out}
.pc.flash{animation:none}
.pc.flash .jz{animation:jpop .7s ease-out}
@keyframes jpop{0%{transform:scale(1.28) rotate(-5deg);filter:drop-shadow(0 0 12px var(--accent))}55%{transform:scale(.97) rotate(1deg)}100%{}}
.tg{position:relative}
.fl{position:absolute;left:50%;top:-6px;font:800 18px/1.2 var(--cond);color:#fff;background:var(--accent);padding:2px 9px;border-radius:999px;animation:floatup 1s ease-out forwards;pointer-events:none;z-index:3;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.fl.m{background:var(--miss)}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,8px) scale(.7)}18%{opacity:1;transform:translate(-50%,-8px) scale(1.08)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-30px) scale(1)}}
.boom{position:fixed;inset:0;z-index:40;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:boomfade 1.6s ease forwards}
.boom::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 46%,color-mix(in srgb,var(--accent) 34%,transparent) 0,transparent 58%);animation:glow 1.6s ease-out forwards}
.boom .bt{position:relative;font:800 clamp(52px,15.5vw,84px)/.9 var(--cond);color:var(--accent);-webkit-text-stroke:3px #fff;paint-order:stroke fill;text-shadow:0 10px 26px rgba(40,20,5,.3);letter-spacing:1px;transform:rotate(-7deg);animation:slam .55s cubic-bezier(.2,1.7,.4,1) both;white-space:nowrap}
.boom .bt b{color:var(--accent2);-webkit-text-stroke:3px #fff}
.boom .bs{position:relative;max-width:92vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:700 16px var(--cond);letter-spacing:2px;text-transform:uppercase;color:#fff;background:var(--ink);border-radius:999px;padding:5px 16px;margin-top:14px;animation:pop2 .45s .18s cubic-bezier(.2,1.6,.4,1) both;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.burst{position:absolute;left:50%;top:46%}
.burst i{position:absolute;left:-5px;top:-8px;width:10px;height:16px;border-radius:3px;background:var(--c);transform:rotate(var(--a));animation:conf 1.1s cubic-bezier(.1,.7,.3,1) forwards}
.burst i:nth-child(3n){width:12px;height:12px;border-radius:50%}
@keyframes conf{0%{transform:rotate(var(--a)) translateY(0) scale(.4);opacity:1}100%{transform:rotate(var(--a)) translateY(calc(var(--d) * -1)) rotate(220deg) scale(1);opacity:0}}
@keyframes slam{0%{transform:scale(3.2) rotate(-7deg);opacity:0}100%{transform:scale(1) rotate(-7deg);opacity:1}}
@keyframes pop2{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes boomfade{0%,72%{opacity:1}100%{opacity:0}}
@keyframes glow{0%{opacity:0}15%{opacity:1}100%{opacity:.4}}
.sb.shake{animation:shake .45s ease}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-6px) rotate(-.6deg)}40%{transform:translateX(5px) rotate(.5deg)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;gap:12px}
.empty h3{margin:0;font:700 28px var(--cond);letter-spacing:.5px}
/* bottom bar */
.bar{position:sticky;bottom:0;margin-top:auto;padding-top:12px}
.barin{background:rgba(255,252,247,.88);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:grid;grid-template-columns:auto 1fr auto auto;gap:2px;align-items:center;padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
.ib{color:var(--muted);display:flex;flex-direction:column;align-items:center;font-size:10.5px;gap:3px;padding:4px 10px;font-weight:600;border-radius:10px}
.ib svg{width:22px;height:22px}
.ib:active{color:var(--text)}
.logp{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:6px 11px;font-size:12.5px;text-align:left;line-height:1.4;min-height:44px;overflow:hidden;margin:0 4px}
.logp div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.logp div+div{color:var(--muted);font-weight:500}
/* sheets */
.ov{position:fixed;inset:0;background:rgba(40,25,12,.42);transition:opacity .16s ease;display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sh{background:#fffdf9;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:10px 16px calc(22px + env(safe-area-inset-bottom));animation:up .2s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(40,25,12,.25)}
.sh::before{content:"";display:block;width:38px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 10px}

.ov.closing{opacity:0;pointer-events:none}
.ov.closing .sh{transform:translateY(60px);transition:transform .16s ease-in}
@keyframes up{from{transform:translateY(50px);opacity:.3}to{transform:none;opacity:1}}
.shh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.shh h2{margin:0;font:700 26px var(--cond);letter-spacing:.3px}
.x{background:var(--surface2);border:1px solid var(--line);border-radius:50%;width:34px;height:34px;font-size:15px;color:var(--muted)}
.btn{background:var(--accent);color:#fff;border-radius:13px;padding:13px 16px;font-weight:700;font-size:15px}
.btn.sec{background:var(--surface2);color:var(--text);border:1px solid var(--line2)}
.btn.danger{background:var(--miss)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btns .btn{flex:1}
.menu{display:flex;flex-direction:column;gap:6px}
.menu button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:15px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:15px;font-weight:600}
.menu button span{color:var(--muted);font-weight:500;font-size:14px}
.menu .dz{color:var(--miss)}
.sec-lbl{font:700 12px var(--cond);letter-spacing:1.5px;color:var(--muted);margin:16px 2px 8px;display:flex;justify-content:space-between;align-items:center}
.fld{display:block;margin-bottom:12px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.3px}
.fld input,.fld select{display:block;width:100%;margin-top:5px;padding:12px;border:1px solid var(--line2);border-radius:11px;color:var(--text);background:#fff;outline:none}
.fld input:focus,.rrow input:focus{border-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sw{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 4px}
.sw button{width:36px;height:36px;border-radius:50%;border:3px solid #fffdf9;box-shadow:0 0 0 1px var(--line2)}
.sw.sm{gap:9px}
.sw.sm button{width:26px;height:26px;border-width:2px}
.sw button.on{box-shadow:0 0 0 2.5px var(--ink);transform:scale(1.08)}
.rrow{display:flex;gap:8px;margin-bottom:8px;align-items:center}

function boxTable(g){

 return '<div class="tw"><table class="box"><thead><tr><th class="nm">PLAYER</th><th>MIN</th><th>PTS</th><th>FG</th><th>3PT</th><th>FT</th><th>OR</th><th>DR</th><th>REB</th><th>AST</th><th>STL</th><th>BLK</th><th>TO</th><th>PF</th><th>+/-</th></tr></thead><tbody>'+rows+'</tbody>'+

 '<div class="kpis"><div class="kpi"><b>'+pct(t.fgm,t.fga)+'</b><small>FG</small></div><div class="kpi"><b>'+pct(t.tpm,t.tpa)+'</b><small>3PT</small></div><div class="kpi"><b>'+pct(t.ftm,t.fta)+'</b><small>FT</small></div></div>';

function niceDate(d){try{var x=new Date(d+'T12:00:00');return x.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});}catch(e){return d;}}
function boxText(g){
 var T=tally(g.events),r=sortRoster(g.roster),t=totals(T,r),us=ourPts(g.events),them=oppPts(g.events);
 var res=us>them?'W':us<them?'L':'T';
 var out=['🏀 '+g.team+' '+us+', '+g.opp+' '+them+(viewGame||g.final?' (Final)':' (in progress)'),niceDate(g.date)+(viewGame||g.final?' · '+res+' '+us+'–'+them:''),''];
 var scorers=r.filter(function(p){return (T[p.id]||blank()).pts>0;}).sort(function(a,b){return T[b.id].pts-T[a.id].pts;});
 if(scorers.length)out.push('Top scorers: '+scorers.slice(0,3).map(function(p){return p.name+' '+T[p.id].pts;}).join(', '),'');
 out.push('Team: FG '+t.fgm+'/'+t.fga+' ('+pct(t.fgm,t.fga)+') · 3PT '+t.tpm+'/'+t.tpa+' · FT '+t.ftm+'/'+t.fta+' · REB '+(t.orb+t.drb)+' · AST '+t.ast+' · STL '+t.stl+' · TO '+t.to,'','Players:');
 r.forEach(function(p){var s=T[p.id]||blank();if(!T[p.id]&&!g.mins[p.id])return;
  var bits=[s.pts+' pts'];
  if(s.orb+s.drb)bits.push((s.orb+s.drb)+' reb');if(s.ast)bits.push(s.ast+' ast');if(s.stl)bits.push(s.stl+' stl');if(s.blk)bits.push(s.blk+' blk');
  if(s.fga)bits.push(s.fgm+'-'+s.fga+' FG');if(s.tpa)bits.push(s.tpm+'-'+s.tpa+' 3PT');if(s.fta)bits.push(s.ftm+'-'+s.fta+' FT');
  if(s.to)bits.push(s.to+' TO');if(s.pf)bits.push(s.pf+' PF');if(s.pm)bits.push(fmtPm(s.pm)+' +/-');if(g.mins[p.id])bits.push(fmtMin(g.mins[p.id])+' min');
  out.push('#'+p.num+' '+p.name+' — '+bits.join(' · '));});
 var m=oppFoulCounts(g.events);
 out.push('','Fouls: '+g.team+' '+cnt(g.events,'PF')+' · '+g.opp+' '+cnt(g.events,'OPF')+(Object.keys(m).length?' ('+Object.keys(m).map(function(k){return '#'+k+'×'+m[k];}).join(', ')+')':''));
 var lk=(!inFrame&&g.share)?SHARE_BASE+'?g='+g.share.id:linkFor(g);if(lk)out.push('',(g.share&&!viewGame&&!finalMode?'Follow live: ':'Full box score: ')+lk);
 return out.join('\n');
}
function boxCsv(g){

 var lines=['Number,Player,MIN,PTS,FGM,FGA,3PM,3PA,FTM,FTA,OREB,DREB,REB,AST,STL,BLK,TO,PF,PLUS_MINUS'];

 return lines.join('\n');

/* ---------- tap feedback ---------- */
var PRESS_SEL='.mk,.ac,.ms,.tg,.tb,.oppb,.ib,.btn,.ck,.tile';
document.addEventListener('touchstart',function(){},{passive:true});
document.addEventListener('pointerdown',function(e){var b=e.target.closest(PRESS_SEL);if(!b)return;b.classList.add('down');var up=function(){setTimeout(function(){b.classList.remove('down');},70);document.removeEventListener('pointerup',up);document.removeEventListener('pointercancel',up);};document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);},true);
function tapSelector(t){var d=t.dataset,q='[data-act="'+d.act+'"]';['t','v','id'].forEach(function(k){if(d[k]!=null)q+='[data-'+k+'="'+String(d[k]).replace(/"/g,'\\"')+'"]';});return q;}
function playTap(t){if(!t.matches||!t.matches(PRESS_SEL))return;var q=tapSelector(t);requestAnimationFrame(function(){var el=document.contains(t)?t:document.querySelector(q);if(!el)return;el.classList.remove('down','tapped');void el.offsetWidth;el.classList.add('tapped');setTimeout(function(){el.classList.remove('tapped');},260);});}
/* ---------- actions ---------- */
document.addEventListener('click',function(e){

 playTap(t);
 if(a==='player'&&lpFired){lpFired=false;return;}

 switch(a){
 case 'player':
  if(subMode){var i=L.onCourt.indexOf(d.id);if(i>=0)L.onCourt.splice(i,1);else L.onCourt.push(d.id);L.oAt=Date.now();save();render();}
  else if(pending)applyStat(pending,d.id);
  else{sel=sel===d.id?null:d.id;render();}
  break;
 case 'stat':
  if(subMode){subMode=false;}
  if(sel)applyStat(d.t,sel);else{pending=pending===d.t?null:d.t;render();}
  break;
 case 'target':
  if(subMode)break;
  if(pending)applyStat(pending,d.v);else{sel=sel===d.v?null:d.v;render();}
  break;

 case 'np-ok':oppFoul(oppNum);break;
 case 'np-quick':oppFoul(d.v);break;
 case 'np-none':oppFoul('');break;
 case 'teams':openSheet(teamsSheet);break;
 case 'team-pick':if(d.id!==S.id){switchTeam(d.id);toast(S.team);}if(sheetFn)closeSheet();else render();break;

  var used=DB.teams.map(function(t){return t.settings.accent;});

  DB.teams.push(nt);switchTeam(nt.id);openTeam();break;
 case 'team-del':case 'team-del-id':
  var dt=DB.teams.filter(function(t){return t.id===(a==='team-del'?S.id:d.id);})[0];if(!dt)break;pendingDel=dt.id;
  var gN=dt.games.length;
  openSheet(confirmSheet('Delete '+esc(dt.team)+'?','This permanently deletes '+esc(dt.team)+' along with '+(function(){var x=['its roster'];if(dt.live.events.length)x.push('the game in progress');if(gN)x.push(gN+' past game'+(gN===1?'':'s'));return x.length>1?x.slice(0,-1).join(', ')+' and '+x[x.length-1]:x[0];})()+'.'+(DB.teams.length===1?' A fresh empty team will take its place.':''),'team-del-yes','Delete team',true));break;
 case 'team-del-yes':
  var did=pendingDel;pendingDel=null;if(!did)break;stopClock();

  if(did===S.id||!DB.teams.some(function(t){return t.id===S.id;})){S=DB.teams[0];L=S.live;DB.cur=S.id;}

  closeSheet();persist('Team deleted');break;
 case 'opp':pushEv({type:'OPP',pid:null,v:+d.v});toast('+'+d.v+' – '+oppName());render();break;
 case 'clock':if(L.running)stopClock();else startClock();break;

 case 'logedit':editId=d.id;openSheet(editSheet);break;
 case 'ed-pid':var e1=editedEv();if(e1){e1.pid=d.v||null;if(e1.pid&&PTS[e1.type]&&!e1.on)e1.on=L.onCourt.slice();save();refreshSheet();render();}break;
 case 'ed-type':var e2=editedEv();if(e2){e2.type=d.v;if(d.v==='TOUT')e2.pid=null;if(PTS[d.v]&&e2.pid&&!e2.on)e2.on=L.onCourt.slice();save();refreshSheet();render();}break;
 case 'ed-oppv':var e3=editedEv();if(e3){e3.v=+d.v;save();refreshSheet();render();}break;
 case 'ed-del':if(editId){S.tomb.ev.push(editId);var did2=editId;L.events=L.events.filter(function(x){return x.id!==did2;});save();toast('Play deleted');openSheet(logSheet);render();}break;
 case 'logdel':S.tomb.ev.push(d.id);L.events=L.events.filter(function(x){return x.id!==d.id;});save();refreshSheet();render();break;
 case 'close':closeSheet();break;
 case 'game':openSheet(gameSheet);break;
 case 'oppcolor':L.oppColor=d.v;L.mAt=Date.now();save();document.querySelectorAll('#oppsw button').forEach(function(b){b.classList.toggle('on',b.dataset.v===d.v);});render();break;
 case 'game-save':
  L.opp=document.getElementById('g-opp').value.trim()||'Opponent';
  L.oppAbbr=(document.getElementById('g-abbr').value.trim()||L.opp.slice(0,3)).toUpperCase();
  L.date=document.getElementById('g-date').value||today();save();closeSheet();break;
 case 'done':if(startMode)startGo=true;closeSheet();break;
 case 'team':linkShown=null;openTeam();break;
 case 'accent':syncTD();TD.accent=d.v;applyTD();refreshSheet();break;
 case 'accent2':syncTD();TD.accent2=d.v;applyTD();refreshSheet();break;
 case 'r-add':syncTD();TD.roster.push({id:uid(),num:'',name:''});refreshSheet();var ins=ov.querySelectorAll('.rrow .n');if(ins.length)ins[ins.length-1].focus();break;
 case 'r-del':syncTD();TD.roster.splice(+d.i,1);applyTD();refreshSheet();break;
 case 'team-save':closeSheet();break;
 case 'zz-unused':
  var oldFull=S.settings.periodMin*60000;
  S.team=String(TD.team).trim()||'My Team';
  S.abbr=(String(TD.abbr).trim()||S.team.slice(0,3)).toUpperCase();
  S.settings.accent=TD.accent;S.settings.accent2=TD.accent2;
  S.settings.periodMin=Math.max(1,Math.min(20,parseInt(TD.min,10)||8));
  S.settings.periods=+TD.per||4;
  if(L.clockMs===oldFull&&!L.running)L.clockMs=S.settings.periodMin*60000;
  S.roster=TD.roster.map(function(p){return {id:p.id,num:String(p.num).trim(),name:String(p.name).trim()};}).filter(function(p){return p.num||p.name;}).map(function(p){return {id:p.id,num:p.num||'?',name:p.name||('#'+p.num)};});
  var ids=S.roster.map(function(p){return p.id;});
  L.onCourt=L.onCourt.filter(function(id){return ids.indexOf(id)>=0;});
  if(!L.onCourt.length)L.onCourt=ids.slice(0,5);
  break;
 case 'history':viewGame=null;openSheet(historySheet);break;
 case 'hist-open':finalMode=false;linkShown=null;viewGame=S.games.filter(function(g){return g.id===d.id;})[0]||null;copyFallback=false;if(viewGame)openSheet(boxSheet);break;
 case 'hist-del':openSheet(confirmSheet('Delete this game?','The box score for '+esc(viewGame.date)+' vs '+esc(viewGame.opp)+' will be removed for good.','hist-del-yes','Delete',true));break;
 case 'hist-del-yes':var gid=viewGame&&viewGame.id;if(gid)S.tomb.g.push(gid);S.games=S.games.filter(function(g){return g.id!==gid;});viewGame=null;closeSheet();persist('Game deleted');break;
 case 'endgame':openSheet(confirmSheet('End game?','Final: '+esc(S.team)+' '+ourPts(L.events)+' – '+esc(L.opp)+' '+oppPts(L.events)+'. The box score goes to Past games and a fresh game starts.','endgame-yes','End &amp; save'));break;
 case 'endgame-yes':
  stopClock();
  S.games.push({id:L.id,date:L.date,opp:L.opp,oppAbbr:L.oppAbbr,oppColor:L.oppColor,team:S.team,us:ourPts(L.events),them:oppPts(L.events),roster:S.roster.map(function(p){return {id:p.id,num:p.num,name:p.name};}),events:L.events,mins:L.mins,share:L.share||null});
  if(L.share&&!inFrame){pushShare('game',L.share,packLive(true)).catch(function(){});}
  S.live=newLive(S);L=S.live;liveSig='';sel=null;pending=null;subMode=false;save();
  viewGame=S.games[S.games.length-1];finalMode=true;finalPersist=true;copyFallback=false;openSheet(boxSheet);render();break;
 case 'discard':openSheet(confirmSheet('Discard this game?','All stats for the current game will be erased. This can\'t be undone.','discard-yes','Discard',true));break;
 case 'discard-yes':stopClock();S.tomb.g.push(L.id);S.live=newLive(S);L=S.live;sel=null;pending=null;save();closeSheet();toast('New game started');break;
 case 'savenow':closeSheet();persist('Saved');break;
 case 'backup':bkPaste=false;openSheet(backupSheet);break;
 case 'bk-dl':downloadFile('team-stats-backup-'+today()+'.json',backupText(),'application/json').then(function(){toast('Backup downloaded');}).catch(function(){toast('Download cancelled');});break;
 case 'bk-copy':var bt=backupText();try{navigator.clipboard.writeText(bt).then(function(){toast('Backup copied');},function(){bkPaste=true;refreshSheet();var ta=document.getElementById('bk-text');if(ta){ta.value=bt;ta.select();}toast('Select all & copy');});}catch(err){toast('Copy not available');}break;
 case 'bk-paste':bkPaste=true;refreshSheet();var ta2=document.getElementById('bk-text');if(ta2)ta2.focus();break;
 case 'bk-restore-text':var tv=document.getElementById('bk-text');tryRestore(tv?tv.value:'');break;
 case 'bk-yes':
  if(!pendingRestore)break;stopClock();
  DB=pendingRestore;pendingRestore=null;
  DB.teams.forEach(function(t){t.id=t.id||uid();normalize(t);});
  S=DB.teams.filter(function(t){return t.id===DB.cur;})[0]||DB.teams[0];DB.cur=S.id;L=S.live;sel=null;pending=null;subMode=false;
  closeSheet();persist('Backup restored');break;
 case 'share-live':
  if(inFrame){toast('Live links work in the installed app');break;}
  if(!L.events.length&&L.opp==='Opponent'){toast('Start a game first');break;}
  var lu=ensureGameShare();deliverLink(lu,'Follow live: '+S.team+' vs '+L.opp,'Follow '+S.team+' vs '+L.opp+' live',"Live link copied");render();break;
 case 'send-link':
  if(!inFrame){var gg=curGame();var su=viewGame?ensurePastShare(viewGame):ensureGameShare();deliverLink(su,gg.team+' '+ourPts(gg.events)+', '+gg.opp+' '+oppPts(gg.events),(viewGame?'Box score: ':'Follow live: ')+gg.team+' vs '+gg.opp);break;}
  var gl=curGame(),u=linkFor(gl);
  var deliver=function(u){
   if(canShare){navigator.share({title:gl.team+' '+ourPts(gl.events)+', '+gl.opp+' '+oppPts(gl.events),text:gl.team+' vs '+gl.opp+' box score',url:u}).catch(function(){});return;}
   try{navigator.clipboard.writeText(u).then(function(){toast('Link copied');},function(){linkShown=u;refreshSheet();});}catch(x){linkShown=u;refreshSheet();}
  };
  if(u)deliver(u);else makeLink(gl,!!viewGame).then(function(u2){linkCache[gameKey(gl)]=u2;linkShown=u2;refreshSheet();toast('Link ready');});
  break;
 case 'share-team':
  if(sheetFn===teamSheet){syncTD();applyTD();}
  linkShown=null;closeSheetSoft();openSheet(shareTeamSheet);break;
 case 'st-send':case 'st-copy':
  ensureTeamShare(S);var tl=teamLinks(S),url=d.v==='edit'?tl.edit:tl.view;
  if(a==='st-send'){navigator.share({title:S.team+' · Team Stats',text:d.v==='edit'?'Join '+S.team+' and help keep stats':'Follow '+S.team+' live',url:url}).catch(function(){});}
  else{try{navigator.clipboard.writeText(url).then(function(){toast(d.v==='edit'?'Contributor link copied':'Viewer link copied');},function(){linkShown=url;refreshSheet();});}catch(x){linkShown=url;refreshSheet();}}
  setTimeout(function(){if(sheetFn===shareTeamSheet)refreshSheet();},2500);break;
 case 'share-team-snap':
  var tdeliver=function(u){
   if(canShare){navigator.share({title:S.team+' · Team Stats',text:S.team+' roster & season stats',url:u}).catch(function(){});return;}
   try{navigator.clipboard.writeText(u).then(function(){toast('Team link copied');},function(){linkShown=u;refreshSheet();});}catch(x){linkShown=u;refreshSheet();}
  };
  prepTeamLink();
  if(teamLink)tdeliver(teamLink);else makeTeamLink(S).then(function(u){teamLink=u;linkShown=u;refreshSheet();toast('Link ready');});
  break;
 case 'tv-import':
  var o=shared;if(!o||o.kind!=='t')break;
  var used=DB.teams.map(function(t){return t.settings.accent;});
  var nt=normalize({id:uid(),team:o.n,abbr:o.a||'US',roster:o.r.map(function(p){return {id:uid(),num:String(p[0]),name:String(p[1])};}),games:[],settings:{periodMin:o.pm||S.settings.periodMin,periods:o.pd||S.settings.periods,v3:1,accent:o.c[0],accent2:o.c[1]}});
  DB.teams.push(nt);switchTeam(nt.id);shared=null;
  clearTimeout(pollT);try{history.replaceState(null,'',location.pathname);}catch(x){location.hash='';}
  view='home';DB.view='home';render();persist(o.n+' added');break;
 case 'vw-tab':vwTab=d.v;render();break;
 case 'tv-open':var mt=DB.teams.filter(function(x){return x.share&&shared&&x.share.id===shared.id;})[0];clearTimeout(pollT);shared=null;try{history.replaceState(null,'',location.pathname);}catch(x){}if(mt)switchTeam(mt.id);go('home');break;
 case 'tv-join':
  var sj=shared;if(!sj||sj.kind!=='t2'||!sj.k||!sj.core)break;
  var jt=teamDocAsTeam(sj.core,sj.live);jt.id=uid();jt.tAt=sj.core.tAt||0;jt.tomb={ev:(sj.live&&sj.live.tombEv)||[],g:(sj.core.tomb&&sj.core.tomb.g)||[],p:(sj.core.tomb&&sj.core.tomb.p)||[]};
  if(!jt.live)jt.live=null;
  jt.share={id:sj.id,secret:sj.k,role:'contrib',atC:sj.atC,atL:sj.atL,sigC:sigOf(sj.core),sigL:sj.live?sigOf(sj.live):''};
  normalize(jt);DB.teams.push(jt);switchTeam(jt.id);L=S.live;applyCS();
  clearTimeout(pollT);shared=null;try{history.replaceState(null,'',location.pathname);}catch(x){}
  view='home';DB.view='home';save();render();persist('Joined '+jt.team);break;
 case 'vw-copy':try{navigator.clipboard.writeText(location.href).then(function(){toast('Link copied');},function(){toast('Copy from the address bar');});}catch(x){toast('Copy from the address bar');}break;
 case 'vw-app':shared=null;clearTimeout(pollT);try{history.replaceState(null,'',location.pathname);}catch(x){location.hash='';}render();break;
 case 'send-share':if(!inFrame){if(viewGame)ensurePastShare(viewGame);else if(L.events.length)ensureGameShare();}
  var gs=curGame(),st=boxText(gs),data={title:gs.team+' vs '+gs.opp,text:st};
  try{var f=new File([boxCsv(gs)],fileName(gs,'csv'),{type:'text/csv'});if(navigator.canShare&&navigator.canShare({files:[f]}))data.files=[f];}catch(x){}
  navigator.share(data).catch(function(err){if(err&&err.name==='AbortError')return;if(data.files){delete data.files;navigator.share(data).catch(function(){});}});
  break;
 case 'send-sms':if(!inFrame){if(viewGame)ensurePastShare(viewGame);else if(L.events.length)ensureGameShare();}location.href='sms:?&body='+encodeURIComponent(boxText(curGame()));break;
 case 'send-email':if(!inFrame){if(viewGame)ensurePastShare(viewGame);else if(L.events.length)ensureGameShare();}var ge=curGame();location.href='mailto:?subject='+encodeURIComponent(ge.team+' '+ourPts(ge.events)+', '+ge.opp+' '+oppPts(ge.events)+' — stats')+'&body='+encodeURIComponent(boxText(ge));break;
 case 'copybox':
  var txt=boxText(viewGame||liveGame());
  try{navigator.clipboard.writeText(txt).then(function(){toast('Copied');},function(){copyFallback=true;refreshSheet();});}catch(err){copyFallback=true;refreshSheet();}
  break;
 case 'csv':
  var g=viewGame||liveGame();
  downloadFile(fileName(g,'csv'),boxCsv(g),'text/csv').then(function(){toast('Downloaded');}).catch(function(){toast('Download cancelled');});
  break;
 }
});

if(!L.onCourt.length&&S.roster.length)L.onCourt=S.roster.slice(0,5).map(function(p){return p.id;});
var qp=new URLSearchParams(location.search),qg=qp.get('g'),qt=qp.get('t');
var qk=qp.get('k');
if(qt&&/^[A-Za-z0-9]{6,16}$/.test(qt)){shared={kind:'loading'};loadTeam2(qt,qk&&/^[A-Za-z0-9]{16,64}$/.test(qk)?qk:null);}
else if(qg&&/^[A-Za-z0-9]{6,16}$/.test(qg)){shared={kind:'loading'};loadShare(qg,'s');}
else if(/^#[st]=/.test(location.hash)){readLink(location.hash).then(function(o){if(o){shared=o;render();}else{toast('That link looks incomplete');}});}
render();
if(!DB.seenTour&&!shared&&!/^#[st]=/.test(location.hash))setTimeout(openTour,350);
})();
